# ---------------------------------------------------------------------------
# CD — deploy backend to VPS.
# Runs only on push to main branch.
# ---------------------------------------------------------------------------
name: CD — Backend

on:
  push:
    branches: [main]

concurrency:
  group: cd-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Validate VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USE }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS_HOST secret is missing"
            exit 1
          fi

          if [ -z "$VPS_USER" ]; then
            echo "ERROR: VPS_USE secret is missing"
            exit 1
          fi

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY secret is missing"
            exit 1
          fi

          echo "VPS secrets are set"

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USE }}
        run: |
          echo "Connecting to $VPS_USER@$VPS_HOST"

          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            APP_DIR="$HOME/E-commerce/e-commerce-nestjs-backend"
            CONTAINER_NAME="ecommerce-nestjs-backend"
            IMAGE_NAME="ecommerce-nestjs-backend:latest"

            echo "Going to project directory..."
            cd "$APP_DIR"

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Docker image..."
            docker build -t "$IMAGE_NAME" .

            echo "Stopping old container..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p 6001:8000 \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              --restart unless-stopped \
              "$IMAGE_NAME"

            echo "Checking running container..."
            docker ps --filter "name=$CONTAINER_NAME"

            echo "Waiting for app to start..."
            sleep 10

            echo "Health check..."

            if curl -f http://localhost:6001/api/v1/health; then
              echo "Health check passed: /api/v1/health"
            elif curl -f http://localhost:6001/api/health; then
              echo "Health check passed: /api/health"
            else
              echo "Health check failed"
              docker logs --tail=150 "$CONTAINER_NAME"
              exit 1
            fi

            echo "Recent logs..."
            docker logs --tail=100 "$CONTAINER_NAME"

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Backend deployment completed successfully"
          EOF
