# ---------------------------------------------------------------------------
# CD — deploy backend to VPS.
# Runs after CI succeeds on main branch, or manually from Actions tab.
# ---------------------------------------------------------------------------
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            APP_DIR="$HOME/E-commerce/e-commerce-nestjs-backend"
            CONTAINER_NAME="ecommerce-nestjs-backend"
            IMAGE_NAME="ecommerce-nestjs-backend:latest"

            echo "Going to project directory..."
            cd "$APP_DIR"

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Docker image..."
            docker build -t "$IMAGE_NAME" .

            echo "Stopping old container..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p 6001:8000 \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              --restart unless-stopped \
              "$IMAGE_NAME"

            echo "Checking running container..."
            docker ps --filter "name=$CONTAINER_NAME"

            echo "Waiting for app to start..."
            sleep 10

            echo "Health check..."
            curl -f http://localhost:6001/api/health

            echo "Recent logs..."
            docker logs --tail=100 "$CONTAINER_NAME"

            echo "Cleaning unused Docker images..."
            docker image prune -f
          EOF
