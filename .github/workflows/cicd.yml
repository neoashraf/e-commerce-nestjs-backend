# ---------------------------------------------------------------------------
# CI/CD — Build, test, and deploy backend
# main -> Production Server
# dev  -> Dev Server
# ---------------------------------------------------------------------------

name: CI/CD

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # =========================================================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # =========================================================================

  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify handlebars production dependency
        run: |
          echo "Checking package.json..."
          node -e "
            const p=require('./package.json');
            const prod=p.dependencies?.handlebars;
            const dev=p.devDependencies?.handlebars;
            console.log('dependencies.handlebars:', prod);
            console.log('devDependencies.handlebars:', dev);
            if(!prod){ console.error('ERROR: handlebars is missing from dependencies.'); process.exit(1); }
            if(dev){ console.error('ERROR: handlebars must not be in devDependencies.'); process.exit(1); }
          "
          echo "Checking package-lock.json..."
          grep -n '"handlebars"' package-lock.json | head -20 || true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: e_commerce_test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      INTERNAL_SERVICE_TOKEN: test-internal-token
      NOTIF_UNSUBSCRIBE_SECRET: test-unsubscribe-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E tests
        run: npm run test:e2e

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for CI check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-nestjs-backend:ci

      - name: Verify handlebars inside Docker image
        run: |
          docker run --rm ecommerce-nestjs-backend:ci node -e "console.log(require.resolve('handlebars'))"

  # =========================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT
  # =========================================================================

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e, docker-build]
    if: success()

    steps:
      - name: Resolve deployment vars
        id: cfg
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VPS_HOST=${{ secrets.VPS_HOST }}"   >> "$GITHUB_OUTPUT"
            echo "VPS_USER=${{ secrets.VPS_USER }}"   >> "$GITHUB_OUTPUT"
            echo "BRANCH=main"                         >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT=production"              >> "$GITHUB_OUTPUT"
            {
              echo "VPS_SSH_KEY<<__SSHEOF__"
              printf '%s' "${{ secrets.VPS_SSH_KEY }}"
              echo ""
              echo "__SSHEOF__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "VPS_HOST=${{ secrets.DEV_VPS_HOST }}"   >> "$GITHUB_OUTPUT"
            echo "VPS_USER=${{ secrets.DEV_VPS_USER }}"   >> "$GITHUB_OUTPUT"
            echo "BRANCH=dev"                              >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT=development"                 >> "$GITHUB_OUTPUT"
            {
              echo "VPS_SSH_KEY<<__SSHEOF__"
              printf '%s' "${{ secrets.DEV_VPS_SSH_KEY }}"
              echo ""
              echo "__SSHEOF__"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate secrets
        run: |
          FAILED=0
          [ -z "${{ steps.cfg.outputs.VPS_HOST }}" ]    && echo "❌ VPS_HOST missing"    && FAILED=1
          [ -z "${{ steps.cfg.outputs.VPS_USER }}" ]    && echo "❌ VPS_USER missing"    && FAILED=1
          [ -z "${{ steps.cfg.outputs.VPS_SSH_KEY }}" ] && echo "❌ VPS_SSH_KEY missing" && FAILED=1
          [ $FAILED -eq 1 ] && exit 1
          echo "✅ All secrets present — deploying to ${{ steps.cfg.outputs.ENVIRONMENT }}"

      - name: Deploy backend
        env:
          VPS_HOST:    ${{ steps.cfg.outputs.VPS_HOST }}
          VPS_USER:    ${{ steps.cfg.outputs.VPS_USER }}
          VPS_SSH_KEY: ${{ steps.cfg.outputs.VPS_SSH_KEY }}
          BRANCH:      ${{ steps.cfg.outputs.BRANCH }}
          ENVIRONMENT: ${{ steps.cfg.outputs.ENVIRONMENT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "🚀 Deploying branch '$BRANCH' to $ENVIRONMENT ($VPS_USER@$VPS_HOST)"

          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              BRANCH="$BRANCH" \
              ENVIRONMENT="$ENVIRONMENT" \
              bash -s << 'ENDSSH'
            set -e

            APP_DIR="/root/E-commerce/e-commerce-nestjs-backend"
            CONTAINER_NAME="ecommerce-nestjs-backend"
            IMAGE_NAME="ecommerce-nestjs-backend:latest"
            NETWORK="postgress-network"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Environment : $ENVIRONMENT"
            echo "  Branch      : $BRANCH"
            echo "  Directory   : $APP_DIR"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd "$APP_DIR"

            # ── Pull latest code ──────────────────────────────
            echo "📥 Pulling latest code from $BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "📌 Current commit: $(git log -1 --oneline)"

            # ── Build fresh image ─────────────────────────────
            echo "🔨 Building Docker image..."
            docker build --no-cache --pull -t "$IMAGE_NAME" .

            # ── Stop & remove old container ───────────────────
            echo "🛑 Stopping old container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" || true

            # ── Start application ─────────────────────────────
            echo "🚀 Starting application container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network "$NETWORK" \
              -p 6001:8000 \
              --env-file .env \
              --restart unless-stopped \
              "$IMAGE_NAME"

            # ── Health check ──────────────────────────────────
            echo "⏳ Waiting for startup..."
            sleep 15

            echo "🏥 Running health check..."
            if curl -fsS http://localhost:6001/api/v1/health > /dev/null 2>&1; then
              echo "✅ Health check passed: /api/v1/health"
            elif curl -fsS http://localhost:6001/api/health > /dev/null 2>&1; then
              echo "✅ Health check passed: /api/health"
            else
              echo "❌ Health check failed — dumping logs"
              docker logs --tail=150 "$CONTAINER_NAME"
              exit 1
            fi

            # ── Tail logs ─────────────────────────────────────
            echo "📋 Recent logs:"
            docker logs --tail=100 "$CONTAINER_NAME"

            # ── Cleanup ───────────────────────────────────────
            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo ""
            echo "✅ Deployment to $ENVIRONMENT completed successfully"
