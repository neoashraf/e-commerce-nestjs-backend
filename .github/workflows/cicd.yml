# ---------------------------------------------------------------------------
# CI/CD — Build, test, and deploy backend (self-hosted)
# dev  -> Home Server
# main -> Hostinger VPS
# ---------------------------------------------------------------------------

name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: {}

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # =========================================================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # =========================================================================

  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify handlebars production dependency
        run: |
          echo "Checking package.json..."
          node -e "
            const p=require('./package.json');
            const prod=p.dependencies?.handlebars;
            const dev=p.devDependencies?.handlebars;
            console.log('dependencies.handlebars:', prod);
            console.log('devDependencies.handlebars:', dev);
            if(!prod){ console.error('ERROR: handlebars is missing from dependencies.'); process.exit(1); }
            if(dev){ console.error('ERROR: handlebars must not be in devDependencies.'); process.exit(1); }
          "
          echo "Checking package-lock.json..."
          grep -n '"handlebars"' package-lock.json | head -20 || true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: e_commerce_test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      INTERNAL_SERVICE_TOKEN: test-internal-token
      NOTIF_UNSUBSCRIBE_SECRET: test-unsubscribe-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E tests
        run: npm run test:e2e

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for CI check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-nestjs-backend:ci

      - name: Verify handlebars inside Docker image
        run: |
          docker run --rm ecommerce-nestjs-backend:ci node -e "console.log(require.resolve('handlebars'))"

  # =========================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (self-hosted runners)
  # =========================================================================

  deploy-home:
    name: Deploy to Home Server
    if: github.ref == 'refs/heads/dev'
    needs: [build-and-test, e2e, docker-build]
    runs-on: [self-hosted, sports-ecommerce-home]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/sports-ecommerce/e-commerce-nestjs-backend/.env"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file from $SERVER_ENV"
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

      - name: Build and restart containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for health check
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:6001/api/v1/health >/dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for app... attempt ${attempt}/20"
            sleep 3
          done

          echo "Health check failed"

          docker compose ps || true
          docker compose logs --tail=100 api || true
          docker compose logs --tail=100 migrate || true

          exit 1

      - name: Seed demo data
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose run -T --rm --build seed npm run seed:all

      - name: Show running containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: docker compose ps

      - name: Prune old images
        shell: bash
        run: docker image prune -f

  deploy-hostinger:
    name: Deploy to Hostinger VPS
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test, e2e, docker-build]
    runs-on: [self-hosted, sports-ecommerce-hostinger]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Load server env file
        shell: bash
        run: |
          SERVER_ENV="/root/sports-ecommerce/e-commerce-nestjs-backend/.env"

          if [ -f "$SERVER_ENV" ]; then
            cp "$SERVER_ENV" .env
            echo "Loaded server env file from $SERVER_ENV"
          else
            echo "Server env file not found at $SERVER_ENV"
            exit 1
          fi

      - name: Build and restart containers
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for health check
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "Connecting to $VPS_USER@$VPS_HOST"

          ssh -T -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            APP_DIR="$HOME/E-commerce/e-commerce-nestjs-backend"
            CONTAINER_NAME="ecommerce-nestjs-backend"
            IMAGE_NAME="ecommerce-nestjs-backend:latest"

            echo "Going to project directory..."
            cd "$APP_DIR"

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Current commit on VPS:"
            git log -1 --oneline

            echo "Git status after reset:"
            git status --short

            echo "Checking handlebars in package.json on VPS..."
            node -e "const p=require('./package.json'); const prod=p.dependencies?.handlebars; const dev=p.devDependencies?.handlebars; console.log('dependencies.handlebars:', prod); console.log('devDependencies.handlebars:', dev); if(!prod){console.error('ERROR: handlebars is missing from dependencies after git reset. This means GitHub main branch does not contain handlebars in package.json.'); process.exit(1);} if(dev){console.error('ERROR: handlebars is in devDependencies. Docker production build uses npm ci --omit=dev, so it will not install devDependencies.'); process.exit(1);}"

            echo "Checking handlebars in package-lock.json on VPS..."
            grep -n '"handlebars"' package-lock.json | head -20 || true

            echo "Building Docker image without cache..."
            docker build --no-cache --pull -t "$IMAGE_NAME" .

            echo "Checking handlebars inside Docker image..."
            docker run --rm "$IMAGE_NAME" node -e "console.log(require.resolve('handlebars'))"

            echo "Stopping old container..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p 6001:8000 \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              --restart unless-stopped \
              "$IMAGE_NAME"

            echo "Checking running container..."
            docker ps --filter "name=$CONTAINER_NAME"

            echo "Waiting for app to start..."
            sleep 10

            echo "Health check..."

            if curl -fsS http://localhost:6001/api/v1/health; then
              echo "Health check passed: /api/v1/health"
            elif curl -fsS http://localhost:6001/api/health; then
              echo "Health check passed: /api/health"
            else
              echo "Health check failed"
              echo "Container logs:"
              docker logs --tail=150 "$CONTAINER_NAME"
              exit 1
            fi

            echo "Recent logs..."
            docker logs --tail=100 "$CONTAINER_NAME"

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Backend deployment completed successfully"
          EOF
