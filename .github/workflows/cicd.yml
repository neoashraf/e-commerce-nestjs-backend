
# ---------------------------------------------------------------------------
# CI/CD — Build, test, and deploy backend
# main -> Production Server
# dev  -> StartSmartz Dev Server
# ---------------------------------------------------------------------------

name: CI/CD

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # =========================================================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # =========================================================================

  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify handlebars production dependency
        run: |
          echo "Checking package.json..."

          node -e "const p=require('./package.json'); const prod=p.dependencies?.handlebars; const dev=p.devDependencies?.handlebars; console.log('dependencies.handlebars:', prod); console.log('devDependencies.handlebars:', dev); if(!prod){console.error('ERROR: handlebars is missing from dependencies.'); process.exit(1);} if(dev){console.error('ERROR: handlebars must not be in devDependencies because Docker production build uses npm ci --omit=dev.'); process.exit(1);}"

          echo "Checking package-lock.json..."
          grep -n '"handlebars"' package-lock.json | head -20 || true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: e_commerce_test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      INTERNAL_SERVICE_TOKEN: test-internal-token
      NOTIF_UNSUBSCRIBE_SECRET: test-unsubscribe-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for CI check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-nestjs-backend:ci

      - name: Verify handlebars inside Docker image
        run: |
          docker run --rm ecommerce-nestjs-backend:ci node -e "console.log(require.resolve('handlebars'))"

  # =========================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT
  # =========================================================================

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e, docker-build]
    if: success()

    steps:

      - name: Select deployment target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "HOST=${{ secrets.VPS_HOST }}" >> $GITHUB_ENV
            echo "USER=${{ secrets.VPS_USER }}" >> $GITHUB_ENV

            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.VPS_SSH_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            echo "BRANCH=main" >> $GITHUB_ENV

          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "HOST=${{ secrets.DEV_VPS_HOST }}" >> $GITHUB_ENV
            echo "USER=${{ secrets.DEV_VPS_USER }}" >> $GITHUB_ENV

            echo "SSH_KEY<<EOF" >> $GITHUB_ENV
            echo "${{ secrets.DEV_VPS_SSH_KEY }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            echo "BRANCH=dev" >> $GITHUB_ENV
          fi

      - name: Validate VPS secrets
        run: |
          [ -z "$HOST" ] && echo "HOST missing" && exit 1
          [ -z "$USER" ] && echo "USER missing" && exit 1
          [ -z "$SSH_KEY" ] && echo "SSH KEY missing" && exit 1

          echo "Secrets validated"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          echo "Deploying branch: $BRANCH"
          echo "Server: $HOST"

          ssh -T -i ~/.ssh/id_rsa "$USER@$HOST" << EOF
            set -e

            APP_DIR="/root/E-Commerce/e-commerce-nestjs-backend"
            CONTAINER_NAME="ecommerce-nestjs-backend"
            IMAGE_NAME="ecommerce-nestjs-backend:latest"

            echo "Going to project directory..."
            cd "\$APP_DIR"

            echo "Pulling latest code from \$BRANCH..."

            git fetch origin \$BRANCH
            git reset --hard origin/\$BRANCH

            echo "Current commit:"
            git log -1 --oneline

            echo "Removing old container..."
            docker rm -f \$CONTAINER_NAME || true

            echo "Building Docker image..."
            docker build --no-cache --pull -t \$IMAGE_NAME .

            echo "Starting container..."
            docker run -d \
              --name \$CONTAINER_NAME \
              -p 6001:8000 \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              --restart unless-stopped \
              \$IMAGE_NAME

            echo "Checking container..."
            docker ps --filter "name=\$CONTAINER_NAME"

            echo "Waiting for startup..."
            sleep 10

            if curl -fsS http://localhost:6001/api/v1/health; then
              echo "Health check passed: /api/v1/health"
            elif curl -fsS http://localhost:6001/api/health; then
              echo "Health check passed: /api/health"
            else
              echo "Health check failed"
              docker logs --tail=150 \$CONTAINER_NAME
              exit 1
            fi

            echo "Recent logs..."
            docker logs --tail=100 \$CONTAINER_NAME

            echo "Cleaning old images..."
            docker image prune -f

            echo "Deployment completed successfully"
          EOF

