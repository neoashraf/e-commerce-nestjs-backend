# ---------------------------------------------------------------------------
# Sports E-Commerce — backend stack (production-like)
#
# Services:
#   postgres   PostgreSQL 16 database (persisted in a named volume, bound to
#              127.0.0.1 only — never exposed to the LAN/WAN)
#   migrate    runs TypeORM migrations once, then exits (uses the `build`
#              stage so the TypeScript data-source + ts-node are available)
#   api        the NestJS backend (production image), starts after migrations
#
# Usage:
#   cp .env.example .env      # then fill in secrets
#   docker compose up --build
#
# API:     http://localhost:6001/api/v1
# Swagger: http://localhost:6001/api/v1/docs
# ---------------------------------------------------------------------------

name: sports-ecommerce-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: sports-ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-e-commerce}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-e-commerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: build
    image: sports-ecommerce-backend:build
    env_file: .env
    environment:
      # Override the .env host so the app reaches the postgres service.
      DB_HOST: postgres
    command: npm run migration:run
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: production
    image: sports-ecommerce-backend:latest
    container_name: sports-ecommerce-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    ports:
      # Host port is fixed at 6001 across both servers — do not source this
      # from .env (the app itself listens on 8000 internally; PORT in .env
      # only matters if the app reads it, and we keep it at 8000 to match).
      - "6001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
